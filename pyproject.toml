[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-experiment-framework"
version = "3.0.0"
description = "Reproducible ontology learning experiment framework"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "networkx>=3.0"]

[project.optional-dependencies]
full = ["sentence-transformers>=3.0", "keybert>=0.8", "yake>=0.4.8", "gliner>=0.2", "spacy>=3.7", "matplotlib>=3.8", "umap-learn>=0.5", "hdbscan>=0.8"]
dev = ["pytest>=8"]

[project.scripts]
olbench = "olbench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["olbench*"]
